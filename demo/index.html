<!doctype html>
<!-- PowerFlo development fixture: all readings and histories are explicitly simulated. -->
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PowerFlo · simulated preview</title>
  <style>
    :root{color-scheme:dark;--canvas:#111c28;--primary-text-color:#edf3f8;--secondary-text-color:#aebcc9;--divider-color:#344454;--ha-card-border-color:#526778}
    :root[data-theme="light"]{color-scheme:light;--canvas:#eef2f5;--primary-text-color:#1c2a37;--secondary-text-color:#4f6070;--divider-color:#bac6d1;--ha-card-border-color:#899dac}
    body{margin:0;padding:24px;background:var(--canvas);color:var(--primary-text-color);font-family:system-ui,sans-serif}main{max-width:1440px;margin:auto}.fixture-controls{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px;font-size:14px}.fixture-controls span{margin-right:auto;color:var(--secondary-text-color)}button,select{min-height:44px;padding:8px 16px;background:transparent;color:inherit;border:1px solid var(--divider-color);border-radius:8px;font:inherit}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid currentColor;outline-offset:4px}powerflo-card{display:block}.demo-settings{margin-top:16px;border:1px solid var(--divider-color);border-radius:8px;padding:16px}.demo-settings summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.demo-settings p{color:var(--secondary-text-color);font-size:14px}.demo-error{color:var(--secondary-text-color)}@media(max-width:550px){body{padding:12px}}
  </style>
</head>
<body><main><div class="fixture-controls"><span>PowerFlo preview · simulated data</span><label>Battery <select id="mode"><option value="charging">Charging</option><option value="discharging">Discharging</option><option value="static">Static</option></select></label><label>Grid <select id="grid-mode"><option value="connected">Connected</option><option value="disconnected">Disconnected</option><option value="unknown">Unknown</option><option value="stale">Stale telemetry</option></select></label><button type="button" id="theme">Change theme</button></div><powerflo-card></powerflo-card><details class="demo-settings"><summary>Customize system</summary><p>Change the title, inverter name/model, ratings, battery capacity, solar array size or image for this simulated preview. Settings are not saved or sent to an inverter.</p><div class="demo-error" role="status"></div><powerflo-card-editor></powerflo-card-editor></details></main>
<script type="module">
  /** @fileoverview Local preview with synthetic sensor updates and daily-reset Recorder responses. */
  import "../dist/powerflo-card.js";
  import { DEFAULT_CONFIG } from "../src/config.js";
  import { periodRange } from "../src/period-history.js";
  const card = document.querySelector("powerflo-card");
  const entities = Object.fromEntries(Object.keys(DEFAULT_CONFIG.entities).map(key => [key, `sensor.demo_${key}`]));
  // This explicit example profile is not a claim about the viewer's installed hardware.
  card.setConfig({ entities,title:"Deye Energy",inverter_name:"DEYE",inverter_model:"SUN-12K-SG02LP1-EU-AM3",inverter_capacity_kw:12,battery_capacity_kwh:32.14,solar_capacity_kw:9.6 });
  const values = { freshness: "on", inverter_status: "normal", grid_connected: "on", solar_power: 4820,
    pv1_power: 1620, pv2_power: 1580, pv3_power: 1620, battery_soc: 85, battery_power: -2000,
    battery_voltage: 53.4, battery_temperature: 32.4, grid_power: 240, grid_voltage: 230.4,
    grid_frequency: 50, load_power: 3000, solar_today: 12.4, grid_today: 3.1, load_today: 10.2, battery_today: 1.8 };
  const hass = { config: { time_zone: "Africa/Lagos" }, states: {},
    /**
     * Supplies synthetic history bounded to the requested date range.
     * @param {string} method HTTP method.
     * @param {string} path Requested history path.
     * @returns {Promise<Array>} Simulated history series.
     */
    callApi: async (method, path) => {
      const query = new URL(path, location.origin);
      const start = new Date(decodeURIComponent(query.pathname.split("/").at(-1))).getTime();
      const end = Date.parse(query.searchParams.get("end_time"));
      const ids = query.searchParams.get("filter_entity_id").split(",");
      return ids.map(id => {
        const key = Object.keys(entities).find(key => entities[key] === id);
        // Explicitly simulated instantaneous demand, distinct from cumulative energy traces.
        if (key === "load_power") return Array.from({length:61},(_,index)=>({entity_id:id,
          state:String(index===60 ? values.load_power : 2300+500*Math.sin(index*.7)+(index===42?1300:0)),
          last_changed:new Date(start+(end-start)*index/60).toISOString()}));
        const maximum = Number(values[key]);
        const output = [];
        for (let day = start; day <= end; day += 86400000) {
          const today = day === periodRange("today", new Date(end), "Africa/Lagos").start.getTime();
          const dayEnd = Math.min(day + 86399000, end);
          for (let index = 0; index <= 12; index += 1) {
            const timestamp = day + (dayEnd - day) * index / 12;
            const fraction = index / 12;
            // Labeled synthetic energy traces show distinct, nonnegative cumulative usage shapes.
            const progress = key === "solar_today" ? fraction ** 2.2 : key === "grid_today" ? fraction ** 0.75
              : key === "battery_today" ? fraction ** 1.4 : fraction + Math.sin(fraction * Math.PI * 2) * 0.04;
            output.push({ entity_id: id, state: String(maximum * progress * (today ? 1 : 1.3)), last_changed: new Date(timestamp).toISOString() });
          }
        }
        return output;
      });
    },
    /**
     * Supplies simulated energy-statistics metadata and hourly changes, never live HA data.
     * @param {Object} message Read-only statistics message.
     * @returns {Promise<unknown>} Simulated statistics result.
     */
    callWS: async message => {
      if (message.type === "recorder/get_statistics_metadata") return message.statistic_ids.map(id => ({ statistic_id: id, has_sum: true, unit_class: "energy", unit_of_measurement: "kWh" }));
      const start = Date.parse(message.start_time);
      const end = Math.floor(Date.parse(message.end_time)/3600000)*3600000;
      return Object.fromEntries(message.statistic_ids.map((id, index) => {
        const rows = [];
        for (let time = start; time + 3600000 <= end; time += 3600000) {
          const localHour = (new Date(time).getUTCHours() + 1) % 24;
          const daylight = Math.max(0, Math.sin((localHour-6)/12*Math.PI));
          const change = index === 0 ? daylight * 2.1 : index === 1 ? .2 + (1-daylight)*.35 : index === 2 ? .3 + daylight*.5 : .18 + (1-daylight)*.2;
          rows.push({ start: time, end: time+3600000, change });
        }
        return [id, rows];
      }));
    } };
  /** Publishes a simulated fresh sensor report every five seconds. */
  function publish() {
    const now = new Date().toISOString();
    hass.states = Object.fromEntries(Object.entries(entities).map(([key, id]) => [id, { state: String(values[key]), attributes: {}, last_updated: now }]));
    hass.states["sun.sun"] = { state: "above_horizon", attributes: { next_setting: new Date(Date.now()+5*3600000).toISOString() } };
    card.hass = hass;
  }
  publish();
  const editor=document.querySelector("powerflo-card-editor");
  editor.setConfig(card.config); editor.hass=hass;
  // Simulated entity IDs remain fixed; the production editor retains full mapping controls in HA.
  editor.shadowRoot.querySelector('[data-section="entities"]').remove();
  editor.addEventListener("config-changed",event=>{
    const previous=card.config;
    try { card.setConfig({...event.detail.config,entities}); publish(); seedRates(); document.querySelector('.demo-error').textContent=""; }
    catch(error) { card.setConfig(previous); document.querySelector('.demo-error').textContent=error.message; }
  });
  /** Seeds only the explicitly simulated preview so forecasts can be demonstrated without waiting. */
  function seedRates() {
    card.runtimeEstimator.samples=[{time:Date.now()-30000,watts:Math.abs(values.battery_power)}];
    card.chargeEstimator.samples=[{time:Date.now()-30000,watts:Math.abs(values.battery_power)}];
  }
  // Seed a simulated 30-second session so the preview immediately illustrates both forecast states.
  card.runtimeEstimator.samples = [{ time: Date.now() - 30000, watts: 512 }];
  card.chargeEstimator.samples = [{ time: Date.now() - 30000, watts: 2000 }];
  setInterval(publish, 5000);
  document.querySelector("#mode").addEventListener("change", event => {
    values.battery_power = event.target.value === "charging" ? -2000 : event.target.value === "discharging" ? 512 : 0;
    values.solar_power = event.target.value === "discharging" ? 0 : 4820;
    publish();
    card.runtimeEstimator.samples = [{ time: Date.now() - 30000, watts: 512 }];
    card.chargeEstimator.samples = [{ time: Date.now() - 30000, watts: 2000 }];
  });
  document.querySelector("#theme").addEventListener("click", () => {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  });
  document.querySelector("#grid-mode").addEventListener("change",event=>{
    values.grid_connected=event.target.value==="disconnected" ? "off" : event.target.value==="unknown" ? "unavailable" : "on";
    values.freshness=event.target.value==="stale" ? "off" : "on";
    values.grid_power=event.target.value==="disconnected" ? 0 : 240;
    publish(); seedRates();
  });
</script></body></html>
